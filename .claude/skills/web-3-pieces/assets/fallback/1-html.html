<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ชานมพี่ป้อง</title>
</head>
<body>
  <header class="hero">
    <h1>ชานมพี่ป้อง 🧋</h1>
    <p class="tagline">หวานกำลังดี ไข่มุกเด้งมาก · เปิดทุกวัน 10:00–20:00</p>
  </header>

  <main>
    <h2>เมนูขายดี</h2>
    <ul class="menu">
      <li class="item">ชานมไข่มุก <span class="price">45 บาท</span></li>
      <li class="item">ชาเขียวมัทฉะ <span class="price">55 บาท</span></li>
      <li class="item">โกโก้เย็นปั่น <span class="price">50 บาท</span></li>
    </ul>

    <section class="vote">
      <p>ถูกใจร้านเราไหม? กดเลย!</p>
      <button id="likeBtn">❤️ ถูกใจ</button>
      <p class="count">ตอนนี้มี <span id="likeCount">0</span> หัวใจ</p>
    </section>
  </main>

  <footer>
    <p>ทำสด ๆ ที่ BRAND'S Brain Camp 2026</p>
    <div class="qr-box">
      <p class="qr-label">สแกนเปิดหน้านี้บนมือถือ 📱</p>
      <img class="qr" src="/demo/qr.png" alt="QR สำหรับเปิดหน้านี้บนมือถือ" width="180" height="180">
    </div>
  </footer>
</body>
</html>
